<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph of Text -->
    <p>This is a basic paragraph of text describing the page content.</p>

    <!-- Hyperlink to an external site -->
    <p>Check out <a href="https://www.w3schools.com" target="_blank">W3Schools</a> for great tutorials.</p>

    <!-- Unordered List -->
    <h2>My Favorite Fruits</h2>
    <ul>
        <li>Apples</li>
        <li>Banages</li>
        <li>Strawberries</li>
    </ul>

    <!-- Image Example (Replace placeholder with your actual image path) -->
    <h2>An Example Image</h2>
    <img src="https://placeholder.com" alt="A simple placeholder image" width="150" height="150">

</body>
</html>
