<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .checkout-wrapper {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .payment-summary {
            background-color: #0f172a;
            color: #ffffff;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .payment-summary th, .payment-summary td {
            text-align: left;
        }

        .order-title {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .order-amount {
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
        }

        .login-body {
            padding: 32px;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .security-badge svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        h2 {
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .pay-btn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .pay-btn:hover {
            background-color: #1d4ed8;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #2563eb;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="checkout-wrapper">
        <!-- Live Order Context -->
        <div class="payment-summary">
            <div>
                <p class="order-title">Premium Subscription</p>
                <small style="color: #94a3b8;">Invoice #10429</small>
            </div>
            <div class="order-amount">$49.00</div>
        </div>

        <div class="login-body">
            <!-- Trust Anchor Indicator -->
            <div class="security-badge">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                SSL Encrypted & Secure Checkout
            </div>

            <h2>Sign in to complete payment</h2>
            <p class="subtitle">Access your saved cards and shipping profiles.</p>

            <form action="/process-payment-auth" method="POST">
                <!-- User Identifier -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com">
                </div>

                <!-- Security Credential -->
                <div class="input-group">
                    <label for="password">Account Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>

                <!-- Intent Trigger -->
                <button type="submit" class="pay-btn">
                    Verify & Pay $49.00
                </button>

                <!-- Navigation Contexts -->
                <div class="footer-links">
                    <a href="#forgot-password">Forgot password?</a>
                    <a href="#guest-checkout">Checkout as guest</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
